x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  API_STUB_BASE_URL: http://api-stub:8000
  WAREHOUSE_DATABASE_URL: postgresql+psycopg2://warehouse:warehouse@postgres:5432/warehouse

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - sales_etl_pgdata:/var/lib/postgresql/data
      - ./docker/init-warehouse-db.sh:/docker-entrypoint-initdb.d/init-warehouse-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-stub:
    build:
      context: .
      dockerfile: docker/api_stub.Dockerfile
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  warehouse-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WAREHOUSE_DATABASE_URL: postgresql+psycopg2://warehouse:warehouse@postgres:5432/warehouse
    entrypoint: ["alembic", "upgrade", "head"]

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-common-env
    entrypoint:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin --email admin@example.com

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse-init:
        condition: service_completed_successfully
      api-stub:
        condition: service_healthy
    environment: *airflow-common-env
    ports:
      - "8090:8080"
    volumes:
      - ./data:/opt/airflow/data
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      warehouse-init:
        condition: service_completed_successfully
      api-stub:
        condition: service_healthy
    environment: *airflow-common-env
    volumes:
      - ./data:/opt/airflow/data
    command: scheduler

volumes:
  sales_etl_pgdata:
